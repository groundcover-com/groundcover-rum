name: Web CI

# @groundcover/browser's unit suite plus the web Playwright suite, which builds
# every workspace package and drives apps/playground in chromium, firefox and
# webkit.
#
# The lane skips diffs that cannot change the browser bundle: those that only
# affect the mobile SDKs (React Native, Flutter, the native iOS and Android SDKs,
# and the native engine they share), the other workflows and the repository's
# GitHub configuration, which never build what this suite tests, and Markdown.
# For those, the build plus the whole browser suite would be pure waste.
#
# That skip lives in the `changes` job, NOT in a trigger-level `paths-ignore`,
# and the difference is load-bearing rather than stylistic. A workflow skipped by
# a trigger filter creates no check run at all, and GitHub blocks a PR whose
# required check never reports. `Web CI` below is a required check, so the
# workflow must always run and always report: a job skipped by its `if:` reports
# success, which satisfies a required check. The `changes` job's filter fails
# OPEN; it says why.
#
# `push` is unfiltered for a different reason: main always gets a full-suite
# signal after merge, whatever the merge commit happened to touch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the default for every job is read-only source access and
# nothing else. `pull-requests: read` is granted to the `changes` job alone.
permissions:
  contents: read

# A force-push cancels the superseded run instead of leaving the whole suite
# running to completion. Only PR runs are cancelled: a main run is the
# post-merge signal and must always finish.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Distinct per lane: the job name IS the check context, so two lanes both
    # calling this `Changed paths` would render two identical rows in the PR and
    # collide as one context if anyone ever required it.
    name: Web changed paths
    # Scoped here rather than at workflow level. `pull-requests: read` is only
    # needed to list the PR's files, and every other job in this lane runs
    # PR-authored code by design — install scripts, the specs themselves — so
    # handing them PR API authority they never use is authority they can leak.
    # A job-level `permissions:` REPLACES the workflow default, so `contents:
    # read` is restated here, as paths-filter's documentation asks.
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      # 'true' when the filter didn't run: see its `if:`.
      web: ${{ steps.filter.outputs.web || 'true' }}
    steps:
      # Pull requests only, from the API, both sides of any rename: a push to main
      # runs the full lane whatever it touched (see the header). Also skipped, so
      # the lane runs, for a pull request past the 3000 files GitHub's API lists,
      # where a list cut short could look mobile-only.
      - id: filter
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000 }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts when it matches a path below and none of the `!` ones.
          predicate-quantifier: some-with-excludes
          filters: |
            # Fail-OPEN, deliberately: the suite runs unless EVERY changed file is
            # provably irrelevant to the browser. Anything unrecognised still runs
            # it, so a new web-relevant directory added later cannot silently lose
            # coverage. The mobile lanes are the mirror image, a positive list
            # failing closed, because there a missed path costs a fleet of macOS
            # runners rather than coverage. Do not "make them consistent".
            #
            # packages/core/** is deliberately NOT excluded. core is source-only
            # and tsup inlines it via `noExternal`, so a core change literally
            # alters the shipped browser bundle. It MUST run this suite. Only the
            # parts of core tsup never sees are left out: its native engine, its
            # Markdown (as all Markdown is), and the files only core's own suite
            # reads (Core CI runs that suite on every PR).
            #
            # The exclusions name categories rather than single files wherever a
            # category is provably irrelevant, so the list doesn't grow with every
            # new workflow or doc.
            web:
              - '**'

              # Every workflow but this one. None of them builds what this suite
              # tests: the CI lanes test their own SDKs, and the publish and
              # release workflows run by hand and build their own package,
              # publish-browser.yml included.
              - '!.github/workflows/!(web.yml)'
              # The repository's GitHub configuration. Not all of .github/actions/:
              # an action stays relevant unless it's named below, as the Kotlin
              # engine's test steps are.
              - '!.github/{CODEOWNERS,dependabot.yml,actionlint.yaml}'
              # Markdown, anywhere, and the licences. The browser package ships
              # its README, CHANGELOG and LICENSE, but nothing this suite builds or
              # runs reads them.
              - '!**/*.md'
              - '!**/LICENSE'
              - '!changelog_unreleased/**'
              # core's tests and the tooling only its own suite reads. The browser
              # build type-checks core's source through tsconfig.json, which
              # excludes the tests.
              - '!packages/core/ts/**/*.test.ts'
              - '!packages/core/ts/lint-fixtures/**'
              - '!packages/core/ts/{eslint.config.mjs,vitest.config.ts,tsconfig.tests.json}'
              # The mobile-only paths.
              - '!packages/react-native/**'
              - '!packages/core/swift/**'
              - '!packages/core/kotlin/**'
              - '!scripts/vendor-engine.mjs'
              - '!apps/rn-playground/**'
              - '!tests/e2e/mobile/**'
              - '!mobilewright.config.ts'
              - '!packages/flutter/**'
              - '!apps/flutter-playground/**'
              - '!.github/actions/engine-tests-kotlin/**'
              - '!packages/ios/**'
              - '!apps/ios-playground/**'
              - '!.swift-format'
              - '!packages/android/**'
              - '!apps/android-playground/**'

  unit:
    name: Browser unit tests
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Restore-only. The Linux store is saved only from main, by Core CI and
      # react-native.yml's `lint` — see core.yml for why.
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile

      # Scoped to the browser package, not a bare `pnpm test`: that is turbo
      # across ALL packages, which would run @groundcover/react-native's vitest,
      # eslint and typecheck here as well — duplicating the RN lane's `lint` and
      # `unit` jobs on every RN PR, and running them for nothing on every
      # web-only PR. RN has no dependency on browser (its only deps are
      # error-stack-parser and fflate), so a browser change cannot affect it.
      # core keeps its own lane.
      - name: Test (@groundcover/browser)
        run: pnpm --filter @groundcover/browser test

      # The browser package's `test` script runs a build, which regenerates
      # packages/browser/src/worker/worker-source.ts from the worker entry.
      # If a contributor edited src/worker/*.ts without committing the
      # regenerated file, this step fails CI.
      - name: Verify worker-source.ts is up to date
        run: git diff --exit-code packages/browser/src/worker/worker-source.ts

  e2e:
    name: E2E — Web (shard ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    # Inside Microsoft's Playwright image, which ships all three browsers AND
    # the OS packages they link against. Before it, every shard ran
    # `playwright install-deps` on a fresh VM: 175 apt packages, 132 MB, from
    # archive.ubuntu.com, every run. No cache could cover that, since apt
    # installs into the system, and the mirror is the weak link: usually
    # ~4 MB/s and under a minute, but intermittently 200-600 KB/s, which
    # stretched the step to 4-12 minutes and, at worst, past this job's
    # timeout on all three shards at once. A registry pull replaces it.
    #
    # The tag moves with @playwright/test in pnpm-lock.yaml: an image's browsers
    # are the builds of one Playwright version. Bump them in the same PR. If
    # they drift, Playwright fails on the missing browser and names the image
    # tag it needs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The browsers are already in the image, under its PLAYWRIGHT_BROWSERS_PATH.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    # Three, and not more. Each shard pays a fixed cost (container, setup,
    # build) against its slice of the tests. Past three, wall
    # clock flattens while runner time keeps climbing, because every extra
    # shard re-pays the whole fixed cost.
    #
    # fail-fast: false so one failing shard does not cancel its siblings — the
    # `report` job wants every shard's blob, including from a red run.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Both consumed by `report`. Every shard resolves identical values — the
    # version from the same lockfile, the total from the same matrix — so the
    # matrix's last-writer-wins on job outputs is benign here.
    #
    # `strategy.job-total` is the matrix length, which makes the `shard:` list
    # above the single source of truth for the shard count: the `--shard=N/total`
    # denominator and the report's completeness check both derive from it. The
    # `/3` in the display name is a label only — if it drifts it misnames a
    # check, it cannot cost coverage.
    outputs:
      playwright-version: ${{ steps.pw.outputs.version }}
      shard-total: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Its own entry, not the `Linux-pnpm-` store that Core CI saves from main.
      # actions/cache matches an entry on its path as well as its key, and in
      # the container the store resolves under the container's HOME rather
      # than the runner's, so that entry can never restore here. Saved below.
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-playwright-image-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-playwright-image-

      - run: pnpm install --frozen-lockfile

      # Main-only and one shard, for the quota reason core.yml gives: cache
      # writes are branch-scoped, so a save from every PR branch is a duplicate
      # store per branch. This entry takes the slot of the browser cache the
      # image made redundant.
      - name: Save pnpm store
        if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-playwright-image-${{ hashFiles('pnpm-lock.yaml') }}

      # Resolved from the installed package rather than package.json's caret
      # range: the `report` job needs the version actually on disk, not the one
      # a range might resolve to next week.
      #
      # Validated as single-line semver, and validated in node rather than the
      # shell so no quoting is involved. The value comes out of node_modules,
      # which a PR controls — package.json, pnpm-lock.yaml, and this repo's
      # pnpm.patchedDependencies can each put an arbitrary string in a package's
      # `version` — and it is interpolated into another job's command. The
      # anchored pattern rejects shell metacharacters and, being anchored, also
      # rejects a multi-line value that would inject extra GITHUB_OUTPUT keys.
      #
      # Hygiene, not a privilege boundary: this job already runs PR-authored code
      # by design (install scripts, and the specs themselves are the point) with
      # no secrets and a read-only token, so an injection here grants nothing new.
      # Validated so a malformed version fails loudly at the source instead of
      # mangling a later job's command.
      - name: Resolve Playwright version
        id: pw
        run: |
          node -e '
            const v = require("@playwright/test/package.json").version;
            if (!/^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/.test(v)) {
              console.log("::error::refusing a non-semver Playwright version: " + JSON.stringify(v));
              process.exit(1);
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "version=" + v + "\n");
          '

      # The root `e2e` script (`pnpm run build && playwright test`) as two steps,
      # so the Actions UI attributes build and test time separately instead of
      # hiding both inside one step. The script remains the local
      # one-shot entry point.
      #
      # Each shard builds its own rather than downloading a shared artifact: the
      # build is cheap, so an artifact round-trip plus a second job's
      # spin-up costs about the same while adding a stale-bundle failure mode.
      - name: Build packages
        run: pnpm run build

      # `vite preview` serves apps/playground/dist. If the build silently
      # produced nothing, preview would serve an empty tree and every failure
      # would read as a test bug. Fail here, where the cause is unambiguous.
      - name: Verify the playground bundle exists
        run: test -s apps/playground/dist/index.html

      # `blob` is what `report` merges; `list` keeps per-test lines in this job's
      # log. Both on the CLI rather than in playwright.config.ts, so the config
      # stays the local-dev default.
      #
      # Note the config's retries (2) and maxFailures (2) apply PER SHARD, so
      # the suite tolerates up to six failures before bailing out. Accepted
      # deliberately as the price of sharding.
      #
      # HOME=/root for Firefox. The container runs as root, but Actions points
      # HOME at /github/home, which belongs to the runner's user, and Firefox
      # refuses to run as root in another user's home directory.
      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        env:
          HOME: /root
        run: npx playwright test tests/e2e/playground --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=blob,list

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          # Intermediate: consumed by `report` once the shards finish, never read by a
          # human. The merged report below is the one with a human retention.
          retention-days: 1

  report:
    name: E2E report
    needs: e2e
    # Runs on a red lane too — a failing suite is exactly when someone wants the
    # trace. The version guard also covers the skip: when `e2e` never ran there
    # is no version and nothing to merge.
    if: ${{ !cancelled() && needs.e2e.outputs.playwright-version != '' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # 5, not 10: the real work is short, so a generous timeout only buys a longer
    # wait before a stall is reported.
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blob-report
          merge-multiple: true

      # download-artifact will happily hand `merge-reports` two blobs instead of
      # three. A shard that dies BEFORE its test step — install, build, or the
      # bundle guard — never writes blob-report/, and upload-artifact only warns
      # on a missing path. merge-reports would then emit a confident,
      # complete-looking HTML report covering two thirds of the suite.
      #
      # The failing shard's own check is still red, so nothing merges on a false
      # green; the damage is that the report lies to whoever opens it, which is
      # the entire reason it exists. A shard that fails at the TEST step does
      # upload its blob, so a normal red run still merges all three.
      #
      # One .zip per shard, flattened here by merge-multiple.
      - name: Verify every shard reported
        run: |
          set -euo pipefail
          found=$(find blob-report -name '*.zip' | wc -l | tr -d ' ')
          echo "blob reports found: $found (expected $EXPECTED)"
          find blob-report -name '*.zip' | sort | sed 's/^/  /'
          if [ "$found" -ne "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED shard blob reports, found $found — the merged report would be silently incomplete"
            exit 1
          fi
        env:
          EXPECTED: ${{ needs.e2e.outputs.shard-total }}

      # Deliberately no checkout and no pnpm install. `merge-reports` needs the
      # Playwright CLI and nothing else — no workspace, no browsers, no pnpm
      # store restore for one command.
      #
      # Pinned to the exact version the shards ran: blob reports are only
      # guaranteed mergeable by a matching Playwright.
      #
      # The fetch bounds matter because this job's real work is short: unbounded,
      # npm's retry ladder can stall far longer than the task, and the failure
      # would read as "the report is broken" rather than "the registry was slow".
      # A local CLI would need a checkout plus a full install or a pnpm store
      # restore for one command, which is the waste this job exists to avoid.
      # Losing the report on a registry outage is cheaper.
      #
      # The version arrives through a quoted env var rather than `${{ }}`
      # interpolation into the command line, so the shell never parses it.
      - name: Merge shard reports
        env:
          PW_VERSION: ${{ needs.e2e.outputs.playwright-version }}
          npm_config_fetch_retries: '2'
          npm_config_fetch_retry_maxtimeout: '20000'
          npm_config_fetch_timeout: '60000'
        run: npx --yes "@playwright/test@$PW_VERSION" merge-reports --reporter=html ./blob-report

      # The merged HTML report, written by `merge-reports` above. The config's
      # own `reporter: 'list'` writes no `playwright-report/`, so this is the
      # only place a CI failure's trace can be read outside the log.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The required status check for this lane.
  #
  # It reports on EVERY PR, including the ones where the work above is
  # skipped — which is why the filter is not on the trigger. It also
  # gives the lane ONE stable name: the shard jobs carry their count, so pinning
  # those in a required-checks list breaks the moment the count changes.
  #
  # `report` is deliberately NOT a dependency: a broken report deserves a red
  # check of its own, but it is not a test failure and must not block a merge.
  gate:
    name: Web CI
    needs: [changes, unit, e2e]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # `if: !cancelled()` above is what makes this correct. A plain `needs:`
      # would SKIP this job when a dependency failed, and a skipped job reports
      # Success — a false green on a red lane. Running unconditionally and
      # judging the results explicitly is the only safe shape.
      #
      # "success or skipped" is right because a job skipped by the filter reports
      # `skipped`, and so does a job whose dependency failed — but the job that
      # actually FAILED reports `failure`, so a real break is still caught. It
      # also catches `changes` itself failing, which the shard checks alone would
      # not: skipped shards would report Success on a commit where nothing ran.
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
