name: Native iOS CI

# Lint, unit, build and device e2e checks for the native iOS SDK (packages/ios, GroundcoverRum),
# the Swift engine it compiles from packages/core/swift, and its playground (apps/ios-playground),
# which the shared Mobilewright suite drives with APP=native. Shaped like flutter.yml, for the same
# reasons:
#
# - `push` is scoped to main, and neither trigger is path-filtered. `Native iOS CI` at the
#   bottom is the lane's check to require, and a workflow skipped by a trigger-level path filter
#   creates no check run at all, which would block every PR that doesn't touch iOS. So the
#   workflow always starts, `changes` decides whether the work runs, and `gate` always reports.
# - `changes` filters on a positive list of paths, failing CLOSED, like the RN and Flutter
#   lanes'.
#
# Android has a workflow of its own (native-android.yml), so an iOS-only change never waits
# on emulators and an Android-only change spends no macOS minutes.
on:
  push:
    branches: [main]
  # No `paths:` on either trigger, on purpose — see the header.
  pull_request:
  workflow_dispatch:

# Least privilege; `pull-requests: read` goes to the `changes` job alone.
permissions:
  contents: read

# Only PR runs are cancelled: a main run is the post-merge signal and must always finish.
concurrency:
  group: native-ios-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.x'
  # The simulator runtime every job here runs on: the one RN's and Flutter's lanes pin.
  IOS_SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

jobs:
  changes:
    name: Native iOS changed paths
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      # 'true' when the filter didn't run: see its `if:`.
      ios: ${{ steps.filter.outputs.ios || 'true' }}
    steps:
      # How the files are listed, and when the filter is skipped: react-native.yml.
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000) }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts when it matches a path below and none of the `!` ones.
          predicate-quantifier: some-with-excludes
          filters: |
            ios:
              - 'packages/ios/**'
              - 'apps/ios-playground/**'
              # The Swift engine the package vendors, and the script that copies it.
              - 'packages/core/swift/**'
              - 'scripts/vendor-engine.mjs'
              # The wire contract and the shared e2e suite, which the native lanes run too, with
              # the suite's root config, the Mobilewright patch and the install it runs from.
              - 'packages/core/wire/**'
              - 'tests/e2e/mobile/**'
              - 'mobilewright.config.ts'
              - 'patches/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.swift-format'
              - '.github/workflows/native-ios.yml'

              # Markdown and the licences, which nothing this lane builds or runs reads.
              - '!**/*.md'
              - '!**/LICENSE'

  # Everything on one macOS runner, in the order that fails cheapest first: macOS runners are
  # costly, and every step needs Xcode's toolchain, so separate jobs would each pay a runner's
  # start-up for little work.
  swift:
    name: Lint, unit tests, package build (Swift)
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      # The SDK's own Swift and the playground's, with the repo's .swift-format. Tracked files
      # only, so the git-ignored engine copy under packages/ios/Sources is never linted (the engine
      # is not held to the formatter).
      - name: Format (swift-format)
        run: |
          git ls-files -z -- 'packages/ios/*.swift' 'apps/ios-playground/*.swift' \
            | xargs -0 xcrun swift-format lint --strict
      # The core (config, session, events, transport) keeps UI frameworks out, so it stays
      # platform-free. What needs one lives in Core/Platform. The
      # pattern also takes the indented import inside `#if canImport(UIKit)` that swift-format
      # requires, an attribute such as @preconcurrency, and `import class UIKit.UIView`.
      - name: The core imports no UI framework
        run: |
          pattern='^[[:space:]]*(@[[:alnum:]_]+(\([^)]*\))?[[:space:]]+)*import[[:space:]]+'
          pattern+='((class|struct|enum|protocol|func|var|let|typealias)[[:space:]]+)?'
          pattern+='(UIKit|SwiftUI)([^[:alnum:]_]|$)'
          if git grep -nE "$pattern" -- 'packages/ios/Sources/GroundcoverRum/Core' \
            ':!packages/ios/Sources/GroundcoverRum/Core/Platform'; then
            echo "::error::Move UIKit and SwiftUI code into the core's Platform directory"
            exit 1
          fi
      # packages/core/swift is the only copy of the engine anyone edits. The package's copy is
      # written by scripts/vendor-engine.mjs before every build and is git-ignored; this guards
      # the one way back to a committed copy that could drift: a `git add -f`. RN's and
      # Flutter's lanes have the same check for their own copies.
      - name: The package's engine copy is not committed
        run: |
          tracked=$(git ls-files \
            packages/ios/Sources/GroundcoverRum/Engine \
            packages/ios/Sources/GroundcoverRumBoot)
          if [ -n "$tracked" ]; then
            echo "::error::The package's engine copy is generated from packages/core; remove it from git:"
            echo "$tracked"
            exit 1
          fi
      # The engine's suite, with the same script RN's and Flutter's ios-app jobs run. (UIKit- and
      # KSCrash-dependent files are outside the SwiftPM test target.)
      - name: Engine unit tests (Swift)
        working-directory: packages/core/swift
        run: ./run-engine-tests.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Writes the engine copy (Node's standard library only, so no install), builds the package
      # for the simulator (with library evolution on, but for the swift-log bridge: see the
      # script), and compares its public API with packages/ios/api.
      - name: Package build + API surface
        run: packages/ios/scripts/api-surface.sh
      # The SDK's own tests, the public API as Swift and Objective-C apps call it among them. On a
      # simulator, since the package is iOS only.
      - name: SDK unit tests (simulator)
        working-directory: packages/ios
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "$IOS_SIM_RUNTIME"; then
            echo "::error::$IOS_SIM_RUNTIME is gone from this image — pick the new pin deliberately, do not fall back silently"
            xcrun simctl list runtimes
            exit 1
          fi
          DEVICE=$(xcrun simctl create "iPhone 17 Pro unit" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$IOS_SIM_RUNTIME")
          # Not -quiet, which prints nothing for a passing test, so a green run can't show what it
          # ran: the summary lines and any failure, a crash or a runner restart among them,
          # filtered from the full log. No diagnostics: xcodebuild otherwise collects them from the
          # simulator after the run, which can time out after every test has passed. Should a
          # collection still run, its timeout line is kept.
          xcodebuild test -scheme GroundcoverRum-Package \
            -destination "platform=iOS Simulator,id=$DEVICE" -collect-test-diagnostics never 2>&1 \
            | grep -E 'Executed [0-9]+ tests?, with|Test run with|Test Case .* failed|recorded an issue|error:|Testing failed:|Test crashed|Restarting after unexpected exit|encountered an error|Failure collecting diagnostics|\*\* TEST (SUCCEEDED|FAILED) \*\*'

  # The playground, built once for the simulator and handed to the e2e shards as an artifact,
  # after its locator contract test (UITests) has walked every screen. Not a cache: the app
  # compiles the SDK from source, so nearly every push changes it. In parallel with `swift`, a
  # runner of its own, so the device lanes don't wait out the unit tests.
  ios-app:
    name: Playground + locator contract (iOS)
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The package compiles a git-ignored copy of the engine (Node's standard library only).
      - name: Write the package's engine copy
        run: node scripts/vendor-engine.mjs
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Generate the project
        run: apps/ios-playground/generate.sh
      - name: Locator contract (UITests) + simulator build
        working-directory: apps/ios-playground
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -q "$IOS_SIM_RUNTIME"; then
            echo "::error::$IOS_SIM_RUNTIME is gone from this image — pick the new pin deliberately, do not fall back silently"
            xcrun simctl list runtimes
            exit 1
          fi
          DEVICE=$(xcrun simctl create "iPhone 17 Pro contract" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$IOS_SIM_RUNTIME")
          # Summary lines and failures only, and no diagnostics, as the SDK's unit tests.
          xcodebuild test -project NativePlayground.xcodeproj -scheme NativePlayground \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build \
            -disableAutomaticPackageResolution -collect-test-diagnostics never 2>&1 \
            | grep -E 'Executed [0-9]+ tests?, with|Test run with|Test Case .* failed|recorded an issue|error:|Testing failed:|Test crashed|Restarting after unexpected exit|encountered an error|Failure collecting diagnostics|\*\* TEST (SUCCEEDED|FAILED) \*\*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-playground-ios
          path: apps/ios-playground/build/Build/Products/Debug-iphonesimulator/NativePlayground.app
          retention-days: 3

  # The shared Mobilewright suite against the playground with APP=native, on the simulator
  # configuration RN's and Flutter's lanes use. Tags decide what runs (the native projects skip
  # @rn-only, @flutter-only and @hybrid-only tests), and every other test has to pass.
  e2e-ios:
    name: E2E — iOS Simulator (shard ${{ matrix.shard }}/3)
    needs: ios-app
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 60
    env:
      APP: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: Start the simulator booting
        run: |
          if ! xcrun simctl list runtimes | grep -q "$IOS_SIM_RUNTIME"; then
            echo "::error::$IOS_SIM_RUNTIME is gone from this image — pick the new pin deliberately, do not fall back silently"
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl shutdown all || true
          DEVICE=$(xcrun simctl create "iPhone 17 Pro e2e" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$IOS_SIM_RUNTIME")
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Restore-only: react-native.yml saves this store from main.
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIM_UDID"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-playground-ios
          path: apps/ios-playground/artifacts/NativePlayground.app
      - name: Install the playground
        run: xcrun simctl install "$SIM_UDID" apps/ios-playground/artifacts/NativePlayground.app
      # Since mobilewright 0.0.61 the fixture terminates the app before each test, and on a
      # simulator a stopped app fails every test's setup (the patch in patches/ tolerates only
      # part of it). Launching once first is RN's and Flutter's "launch the playground" step.
      - name: Launch the playground
        run: |
          xcrun simctl launch "$SIM_UDID" com.groundcover.nativeplayground
          sleep 3
      - name: Install the WebDriverAgent runner
        run: node_modules/.bin/mobilecli agent install --device "$SIM_UDID" -v
      - name: Warm WebDriverAgent
        continue-on-error: true
        run: npx mobilewright test --project=native-ios tests/e2e/mobile/00-bootstrap/00-warmup.spec.ts
      - name: Run Mobilewright e2e (iOS shard ${{ matrix.shard }}/3)
        run: npx mobilewright test --project=native-ios --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-e2e-report-ios-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  gate:
    name: Native iOS CI
    needs: [changes, swift, ios-app, e2e-ios]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # As in flutter.yml: `!cancelled()` so a failed dependency is judged here rather than
      # skipping the gate (a skipped job reports Success), and "success or skipped" because a
      # filtered-out job reports skipped while a broken one reports failure.
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
