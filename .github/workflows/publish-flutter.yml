name: Publish groundcover_rum to pub.dev

# Publishes packages/flutter to pub.dev from a `groundcover_rum-v<version>` tag.
# release-flutter.yml, run on main, creates that tag and starts this workflow on
# it; that is the way to release. Run this one by hand only on an existing tag
# (Run workflow → "Use workflow from" → Tags), to retry a publish.
#
# The run has to be on the tag, not on a branch, because pub.dev accepts an
# automated publish only from a run whose ref is a tag matching the package's
# tag pattern (`groundcover_rum-v{{version}}` on its admin page) with the
# pubspec's version filled in, even when the run was started by hand. The
# package name in the tag says which of this repository's packages it releases;
# pub.dev shows only the version. pub.dev authenticates the run through GitHub's
# OIDC token, so no pub credential is stored here. Its admin page has to trust
# this repository, that tag pattern, `workflow_dispatch` events and the
# `pub.dev` environment below.
#
# validate checks the tag before anything is published; if it fails, delete the
# tag, fix main, and run release-flutter.yml again.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-flutter-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  NODE_VERSION: '24.x'

jobs:
  validate:
    name: Validate the release
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: The run is on a groundcover_rum-v<version> tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::run this workflow on the groundcover_rum-v<version> tag (Use workflow from → Tags), not on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^groundcover_rum-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]]; then
            echo "::error::$GITHUB_REF_NAME isn't groundcover_rum-v<version> with a version pub accepts (groundcover_rum-v0.0.1-rc.1)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      # The whole history, so main is there to compare the tag against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tag's commit is what gets published, so it must already be on main:
      # never a commit that only an unmerged branch has.
      - name: The tagged commit is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is at $GITHUB_SHA, which isn't on main; tag a commit on main"
            exit 1
          fi
      - name: The tag, the pubspec, the SDK's own version and the podspec say the same
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          pubspec=$(sed -n 's/^version:[[:space:]]*//p' packages/flutter/pubspec.yaml)
          dart=$(sed -n "s/^const sdkVersion = '\(.*\)';/\1/p" packages/flutter/lib/src/version.dart)
          pod=$(sed -n "s/^[[:space:]]*s\.version[[:space:]]*=[[:space:]]*'\(.*\)'/\1/p" packages/flutter/ios/groundcover_rum.podspec)
          echo "tag=$VERSION pubspec=$pubspec version.dart=$dart podspec=$pod"
          if [ "$pubspec" != "$VERSION" ] || [ "$dart" != "$VERSION" ] || [ "$pod" != "$VERSION" ]; then
            echo "::error::the tag says $VERSION; bump packages/flutter's pubspec, lib/src/version.dart and the podspec to it first"
            exit 1
          fi
      - name: The CHANGELOG has an entry for it
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if ! grep -qE "^## ${VERSION//./\\.}([[:space:]]|$)" packages/flutter/CHANGELOG.md; then
            echo "::error::packages/flutter/CHANGELOG.md has no '## $VERSION' entry"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The package ships a git-ignored copy of the native engine (see
      # packages/core/README.md), so the dry run checks the package as it will
      # be published: with the copy written.
      - name: Write the plugin's engine copy
        run: node scripts/vendor-engine.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Unit tests
        working-directory: packages/flutter
        run: flutter test
      - name: Publish dry run, with the engine in the package
        working-directory: packages/flutter
        run: |
          set -euo pipefail
          flutter pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.txt"
          for file in GCRumEngine.swift GCRumProcessBoot.m GcRumEngine.kt; do
            if ! grep -q "$file" "$RUNNER_TEMP/dry-run.txt"; then
              echo "::error::the package would ship without the native engine ($file is missing); check packages/flutter/.pubignore"
              exit 1
            fi
          done
      # Pub's own score, for the release notes; it doesn't gate, since points
      # can move with pana's version rather than with the package.
      - name: Pub score (pana)
        continue-on-error: true
        working-directory: packages/flutter
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning . | tee "$RUNNER_TEMP/pana.txt" | tail -n 20
          { echo '### pana'; echo '```'; tail -n 40 "$RUNNER_TEMP/pana.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to pub.dev
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Named so pub.dev can require it, and so the repo can put a required
    # reviewer on it.
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The engine copy is git-ignored but listed for pub by .pubignore, and
      # `dart pub publish` has no hook to write it, so it is written here.
      - name: Write the plugin's engine copy
        run: node scripts/vendor-engine.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      # Exchanges the job's OIDC token for a pub.dev one.
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - name: Publish
        working-directory: packages/flutter
        run: flutter pub publish --force
      - name: Summary
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: echo "Published groundcover_rum $VERSION from $GITHUB_REF_NAME ($GITHUB_SHA)." >> "$GITHUB_STEP_SUMMARY"
