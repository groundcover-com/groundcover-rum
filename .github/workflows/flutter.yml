name: Flutter CI

# Lint, unit and device e2e for groundcover_rum (packages/flutter) and its
# playground, on Flutter-touching changes. Shaped like react-native.yml, for the
# same reasons:
#
# - `push` is scoped to main and path-filtered at the trigger; `pull_request` is
#   NOT. `Flutter CI` at the bottom is the lane's check to require, and a
#   workflow skipped by a trigger-level path filter creates no check run at all,
#   which would block every PR that doesn't touch Flutter. So on PRs the workflow
#   always starts, `changes` decides whether the work runs, and `gate` always
#   reports. Full reasoning in .github/actions/changed-paths.
# - The `changes` filter fails CLOSED (a positive list), like the RN lane's.
#
# The device jobs run the shared Mobilewright suite (tests/e2e/mobile) against
# apps/flutter-playground with APP=flutter. Tags decide what runs: the Flutter
# projects skip @rn-only tests, as the RN projects skip @flutter-only ones, and
# every other test has to pass (tests/e2e/mobile/README.md). A test that a
# feature in progress can't pass carries a pending mark; the lint job fails on any
# mark left once the PR is out of draft, so nothing merges on one.
on:
  push:
    branches: [main]
    paths:
      - 'packages/flutter/**'
      - 'apps/flutter-playground/**'
      # The wire contract the Dart golden checks.
      - 'packages/core/wire/**'
      # The native engine the plugin vendors, the script that copies it, and its
      # unit-test steps (shared with react-native.yml).
      - 'packages/core/swift/**'
      - 'packages/core/kotlin/**'
      - 'scripts/vendor-engine.mjs'
      - '.github/actions/engine-tests-kotlin/**'
      # The shared e2e suite, its root config and the Mobilewright patch: every
      # spec runs against the Flutter app too.
      - 'tests/e2e/mobile/**'
      - 'mobilewright.config.ts'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/flutter.yml'
      - '.github/actions/changed-paths/**'
      # Set aside after the includes above, as the `changes` job does.
      - '!packages/core/**/*.md'
      - '!tests/e2e/mobile/native-*.sh'
      - '!tests/e2e/mobile/ci-native-*.sh'
      #
      # THIS LIST AND THE `changes` JOB'S PATTERN LIST MUST AGREE: one policy in
      # two syntaxes.
  # The default activity types, plus ready_for_review: leaving draft is what
  # turns the pending-marks check in `lint` on, so it has to start a run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Least privilege; `pull-requests: read` goes to the `changes` job alone.
permissions:
  contents: read

# Only PR runs are cancelled: a main run is the post-merge signal and must
# always finish (the same rule as web.yml and core.yml).
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The one version every job builds and tests on.
  FLUTTER_VERSION: '3.47.5'
  NODE_VERSION: '24.x'
  # The emulator build react-native.yml pins and caches its AVD snapshot under.
  # Keep the two equal: this lane restores RN's snapshot and never saves its own.
  ANDROID_EMULATOR_BUILD: '16428233'

jobs:
  changes:
    name: Flutter changed paths
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      ios-native: ${{ steps.filter.outputs.ios-native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/changed-paths
      - id: paths
        uses: ./.github/actions/changed-paths
      - name: Decide whether the Flutter lane runs
        id: filter
        env:
          FILES: ${{ steps.paths.outputs.files-path }}
          IS_PR: ${{ steps.paths.outputs.is-pull-request }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" != 'true' ]; then
            echo 'not a PR — the trigger already filtered this'
            echo 'flutter=true' >> "$GITHUB_OUTPUT"
            echo 'ios-native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # What the CocoaPods build (ios-pods) can see change: the plugin's and
          # the playground's native iOS halves, the engine, and the manifests
          # that pick plugins. A Dart-only push can't break it.
          if grep -qE \
              -e '^packages/flutter/ios/' \
              -e '^packages/flutter/pubspec\.yaml$' \
              -e '^apps/flutter-playground/ios/' \
              -e '^apps/flutter-playground/pubspec\.(yaml|lock)$' \
              -e '^packages/core/swift/' \
              -e '^scripts/vendor-engine\.mjs$' \
              -e '^\.github/workflows/flutter\.yml$' \
              "$FILES"; then
            echo 'ios-native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ios-native=false' >> "$GITHUB_OUTPUT"
          fi
          # Keep in sync with the `push` trigger's paths: list above. Core's
          # Markdown and the native lanes' own e2e scripts reach no Flutter build
          # or test. A temp file rather than a pipe, for react-native.yml's reason.
          grep -vE \
              -e '^packages/core/.*\.md$' \
              -e '^tests/e2e/mobile/(ci-)?native-[^/]+\.sh$' \
              "$FILES" > "$RUNNER_TEMP/flutter-files" || true
          if grep -qE \
              -e '^packages/flutter/' \
              -e '^apps/flutter-playground/' \
              -e '^packages/core/wire/' \
              -e '^packages/core/swift/' \
              -e '^packages/core/kotlin/' \
              -e '^scripts/vendor-engine\.mjs$' \
              -e '^\.github/actions/engine-tests-kotlin/' \
              -e '^tests/e2e/mobile/' \
              -e '^mobilewright\.config\.ts$' \
              -e '^patches/' \
              -e '^package\.json$' \
              -e '^pnpm-lock\.yaml$' \
              -e '^pnpm-workspace\.yaml$' \
              -e '^\.github/workflows/flutter\.yml$' \
              -e '^\.github/actions/changed-paths/' \
              "$RUNNER_TEMP/flutter-files"; then
            echo 'Flutter-relevant changes found — running the lane'
            echo 'flutter=true' >> "$GITHUB_OUTPUT"
          else
            echo 'no Flutter-relevant changes — skipping the lane'
            echo 'flutter=false' >> "$GITHUB_OUTPUT"
          fi

  # Static analysis only, first, like the RN lane: everything else needs it.
  #
  # No caches, deliberately. flutter-action's built-in cache saves on every
  # branch, and GitHub scopes cache writes per branch, so it would duplicate the
  # SDK per PR (see the pnpm-store save in react-native.yml for what that does to
  # the repo's 10GB). Both packages' pub dependencies are a few small downloads.
  lint:
    name: Format + analyze (Dart)
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - run: flutter --version
      - name: pub get
        run: |
          (cd packages/flutter && flutter pub get)
          (cd apps/flutter-playground && flutter pub get)
      # The formatter's style follows each package's language version (its SDK
      # floor), so this is the same check `dart format` gives a developer there.
      - name: Format
        run: dart format --output=none --set-exit-if-changed packages/flutter apps/flutter-playground
      - name: Analyze (groundcover_rum)
        working-directory: packages/flutter
        run: flutter analyze
      - name: Analyze (playground)
        working-directory: apps/flutter-playground
        run: flutter analyze
      # A Flutter test that a feature in progress can't pass carries
      # `test.fail(isFlutter, "pending: …")` (tests/e2e/mobile/README.md),
      # which keeps the e2e lanes green while the marks match reality. Nothing
      # may merge on one: a draft PR can't merge, so the check bites when the PR
      # leaves draft (a run of its own, see the trigger) and on every push after.
      # `isFlutter` exists for marks alone (support/app.ts), so any use of it in a
      # spec is one, however a formatter wraps the call.
      - name: No pending e2e marks outside a draft PR
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
        run: |
          marks=$(git grep -nw isFlutter -- ':(glob)tests/e2e/mobile/**/*.spec.ts' || true)
          if [ -n "$marks" ]; then
            echo "::error::Flutter e2e tests still marked pending; remove each mark before merging:"
            echo "$marks"
            exit 1
          fi
      # packages/core/{swift,kotlin} is the only copy of the engine anyone edits.
      # The plugin's copy is written by scripts/vendor-engine.mjs before every
      # native build and before publish, and is git-ignored. This guards the one
      # way back to a committed copy that could drift: a `git add -f`. RN's lint
      # has the same check for its own copy.
      - name: The plugin's engine copy is not committed
        run: |
          tracked=$(git ls-files \
            packages/flutter/ios/groundcover_rum/Sources/groundcover_rum/Engine \
            packages/flutter/ios/groundcover_rum/Sources/GroundcoverRumBoot \
            packages/flutter/android/src/main/kotlin/com/groundcover/rum/engine)
          if [ -n "$tracked" ]; then
            echo "::error::The plugin's engine copy is generated from packages/core; remove it from git:"
            echo "$tracked"
            exit 1
          fi

  # The engine the plugin ships, unit-tested in this lane's own gate as in RN's:
  # the same steps react-native.yml's android-unit job runs, from one shared
  # definition. Its own job, and a `needs` of the Android e2e lane, so the
  # emulators never boot against an engine whose unit tests already fail. The
  # Swift half runs inside ios-app, as in RN, rather than paying for a macOS
  # runner of its own.
  engine-unit:
    name: Engine unit tests (Kotlin)
    needs: lint
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Read-only off main: GitHub scopes cache writes per branch, so a save from
      # every PR would duplicate the Gradle cache per branch. Main saves it
      # whenever the engine or the plugin changes.
      - uses: ./.github/actions/engine-tests-kotlin
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

  # Includes the core import gate (packages/flutter/test/core_import_gate_test.dart),
  # which keeps lib/src/core platform-free, and the playground's locator
  # contract, which pins the semantics the e2e suite locates.
  unit:
    name: Unit tests (Dart)
    needs: lint
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Unit tests (groundcover_rum)
        working-directory: packages/flutter
        run: flutter test
      - name: Unit tests (playground)
        working-directory: apps/flutter-playground
        run: flutter test

  # The shared suite compiles against Mobilewright's real API, and its helpers
  # have their own unit tests, so a harness change can break the Flutter lane
  # without touching Flutter. RN CI's lint job runs the same two commands; they
  # are repeated here on purpose. `Flutter CI` is this lane's own gate, so it
  # can't lean on another workflow's job: whether RN CI's lint runs on a PR is
  # RN's path filter's call, and whether it is required is RN's
  # branch-protection entry, not this lane's.
  e2e-typecheck:
    name: Typecheck the e2e suite
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.15.0
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Restore-only: the same key react-native.yml's lint job saves from main.
      - name: Restore pnpm store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      # Through the RN package's toolchain, as the RN lane checks the suite.
      - name: Typecheck tests/e2e/mobile
        run: pnpm --filter @groundcover/react-native exec tsc -p "$GITHUB_WORKSPACE/tests/e2e/mobile"
      - name: Unit-test the e2e support helpers
        run: pnpm --filter @groundcover/react-native exec vitest run --config "$GITHUB_WORKSPACE/tests/e2e/mobile/support/vitest.config.ts"

  # The playground's debug simulator build, once per run, handed to the shards as
  # an artifact. Not a cache, unlike RN's prebuilt app: a Flutter debug build
  # carries the Dart code (the SDK and the app), so nearly every push changes it,
  # and a per-branch cache entry would only be written and evicted.
  ios-app:
    name: iOS app + engine tests (once)
    # macOS runners are costly; lint first, as in the RN lane.
    needs: lint
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      # The engine's Swift unit tests, first, as RN's ios-app job runs them: the
      # same script, so a failure surfaces before the build rather than after it.
      # (UIKit- and KSCrash-dependent files are outside the SwiftPM test target;
      # the e2e suite covers those.)
      - name: Engine unit tests (Swift)
        working-directory: packages/core/swift
        run: ./run-engine-tests.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The plugin compiles a git-ignored copy of the engine (see lint). No
      # install needed: the script uses Node's standard library only.
      - name: Write the plugin's engine copy
        run: node scripts/vendor-engine.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Build the playground (simulator, debug)
        working-directory: apps/flutter-playground
        run: flutter build ios --simulator --debug --dart-define-from-file=e2e/ios.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-playground-ios
          path: apps/flutter-playground/build/ios/iphonesimulator/Runner.app
          retention-days: 3

  # The podspec path. Flutter builds a plugin through its Swift package when an
  # app has SwiftPM enabled (ios-app, the default) and through its podspec when
  # it doesn't, which is still common: an app whose other plugins lack a Swift
  # package, or one that turned SwiftPM off. The two manifests list the engine's
  # sources and KSCrash separately, so this builds the second one too. Build only:
  # the e2e suite runs on ios-app's build, and the engine is the same code.
  # Runs when an input this build can see changed (see `changes`), to spare a
  # costly macOS runner on Dart-only pushes.
  ios-pods:
    name: iOS app via CocoaPods (build only)
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.ios-native == 'true' }}
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Write the plugin's engine copy
        run: node scripts/vendor-engine.mjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      # Machine-wide on a throwaway runner. Flutter then writes the playground a
      # Podfile and runs `pod install` itself.
      - name: Turn SwiftPM off
        run: flutter config --no-enable-swift-package-manager
      - name: Build the playground through CocoaPods (simulator, debug)
        working-directory: apps/flutter-playground
        env:
          LANG: en_US.UTF-8
        run: flutter build ios --simulator --debug --dart-define-from-file=e2e/ios.json

  e2e-ios:
    name: E2E — iOS Simulator (shard ${{ matrix.shard }}/3)
    needs: ios-app
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 60
    env:
      APP: flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      # The same pinned runtime and fresh device as the RN lane, so both apps run
      # on one simulator configuration.
      - name: Start the simulator booting
        run: |
          RUNTIME=com.apple.CoreSimulator.SimRuntime.iOS-26-5
          if ! xcrun simctl list runtimes | grep -q "$RUNTIME"; then
            echo "::error::$RUNTIME is gone from this image — pick the new pin deliberately, do not fall back silently"
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl shutdown all || true
          DEVICE=$(xcrun simctl create "iPhone 17 Pro e2e" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME")
          echo "SIM_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.15.0
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Restore-only: react-native.yml saves this store from main.
      - name: Restore pnpm store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIM_UDID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flutter-playground-ios
          path: apps/flutter-playground/artifacts/ios/Runner.app
      - name: Install the playground
        run: xcrun simctl install "$SIM_UDID" apps/flutter-playground/artifacts/ios/Runner.app
      # Since mobilewright 0.0.61 the fixture terminates the app before each test,
      # and on a simulator a stopped app fails every test's setup (the patch in
      # patches/ tolerates only part of it). Launching once first is RN's "Warm
      # the simulator" step.
      - name: Launch the playground
        run: |
          xcrun simctl launch "$SIM_UDID" com.groundcover.flutterplayground
          sleep 3
      - name: Install the WebDriverAgent runner
        run: node_modules/.bin/mobilecli agent install --device "$SIM_UDID" -v
      - name: Warm WebDriverAgent
        continue-on-error: true
        run: npx mobilewright test --project=flutter-ios tests/e2e/mobile/00-bootstrap/00-warmup.spec.ts
      - name: Run Mobilewright e2e (iOS shard ${{ matrix.shard }}/3)
        run: npx mobilewright test --project=flutter-ios --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: flutter-e2e-report-ios-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  # x86_64, for CI's emulators. Handed over as an artifact, like the iOS app.
  android-app:
    name: Android apk (once)
    needs: lint
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Write the plugin's engine copy
        run: node scripts/vendor-engine.mjs
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Build the playground (debug, x86_64)
        working-directory: apps/flutter-playground
        run: flutter build apk --debug --target-platform android-x64 --dart-define-from-file=e2e/android.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-playground-android
          path: apps/flutter-playground/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  e2e-android:
    name: E2E — Android Emulator (shard ${{ matrix.shard }}/3)
    needs: [engine-unit, android-app]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9.15.0
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flutter-playground-android
          path: apps/flutter-playground/artifacts/android
      # RN's snapshot, saved from main by react-native.yml. Restore-only here: one
      # lane owns the entry, so two lanes never race to write it.
      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-emu${{ env.ANDROID_EMULATOR_BUILD }}
      - name: Create AVD (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: ${{ env.ANDROID_EMULATOR_BUILD }}
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: false
          script: echo "AVD created."
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      # CI's x86_64 emulator gives mobilecli the native accessibility tree, not the
      # VM-service tree an arm64 emulator gives locally; the script
      # explains, and FLUTTER_NATIVE_TREE=1 reproduces it on an arm64 emulator.
      - name: Run e2e on an Android emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "1"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: ${{ env.ANDROID_EMULATOR_BUILD }}
          force-avd-creation: false
          emulator-boot-timeout: 150
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: MW_SHARD=${{ matrix.shard }}/3 bash tests/e2e/mobile/ci-flutter-android-e2e.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: flutter-e2e-report-android-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  gate:
    name: Flutter CI
    needs: [changes, lint, unit, e2e-typecheck, engine-unit, ios-app, ios-pods, e2e-ios, android-app, e2e-android]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # As in react-native.yml: `!cancelled()` so a failed dependency is judged
      # here rather than skipping the gate (a skipped job reports Success), and
      # "success or skipped" because a filtered-out job reports skipped while a
      # broken one reports failure.
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
