name: Release the iOS SDK

# Publishes the native iOS SDK (packages/ios) to groundcover-rum-ios, the public repository iOS
# customers install it from with Swift Package Manager, by hand, from main only.
#
# 1. validate: the version is new, both as ios-v<version> here and as <version> in the mirror, and
#    is the one the SDK reports (sdkVersion in DeviceAttributes.swift); the CHANGELOG has an entry
#    for it. packages/ios/scripts/build-mirror.sh writes the mirror's tree, check-mirror.sh builds
#    it on its own and from an app's package that resolves it by tag, and the tree is kept as this
#    run's `ios-mirror` artifact, for review. The SDK's own tests are Native iOS CI's; this checks
#    the package as it ships. A dry run stops here.
# 2. publish, in the `ios-mirror` environment (a reviewer approves): commits that tree to the
#    mirror's main as one commit, tags it <version> and pushes both. The mirror's tag is bare
#    semver because SwiftPM reads only those as versions; every tag here keeps its package's prefix.
# 3. tag: ios-v<version> here, at the commit the tree came from. If it fails, re-run the run's
#    failed jobs: the mirror push isn't repeated (a second push of the same version is refused),
#    and the tag job accepts a tag it already pushed.
#
# SwiftPM installs by tag, so a mirror tag must never move. The mirror is written only by this
# workflow, as groundcover-bot, the org's release app, through a token that can write to the
# mirror's contents and nothing else. The app must be installed on groundcover-rum-ios, and the
# `ios-mirror` environment must be able to read the GROUNDCOVER_BOT_APP_ID variable and the
# GROUNDCOVER_BOT_PRIVATE_KEY secret. Without them, publish stops before pushing anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, exactly as sdkVersion in packages/ios (e.g. 0.0.1-rc.0)
        required: true
        type: string
      dry_run:
        description: Build and check the mirror and keep it as an artifact, but push nothing.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

env:
  MIRROR: groundcover-com/groundcover-rum-ios
  NODE_VERSION: '24.x'

jobs:
  validate:
    name: Validate the release
    runs-on: blacksmith-12vcpu-macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release from main, not $GITHUB_REF: the tag's commit is what gets published"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Here, asked of the API with the job's token, which reads this repository's tags whether
      # it is public or private; an unauthenticated `git ls-remote` fails on a private repository,
      # which would read as "no such tag". The mirror is public, so ls-remote reads it, and tells
      # "no such tag" (2) from "couldn't read" (128) by exit code.
      # A dry run only warns when it can't read the mirror, so it can rehearse a release before
      # the mirror exists.
      - name: The version is valid, and both tags are new
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version SwiftPM accepts"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/ios-v$VERSION")
          case "$status" in
            404) ;;
            200) echo "::error::ios-v$VERSION already exists"; exit 1 ;;
            *) echo "::error::couldn't check whether ios-v$VERSION exists (HTTP $status)"; exit 1 ;;
          esac
          rc=0
          git ls-remote --exit-code --tags "https://github.com/$MIRROR.git" "refs/tags/$VERSION" \
            > /dev/null || rc=$?
          case "$rc" in
            2) ;;
            0) echo "::error::$MIRROR already has the tag $VERSION"; exit 1 ;;
            *)
              if [ "$DRY_RUN" = true ]; then
                echo "::warning::couldn't read $MIRROR (exit $rc); a release would stop here"
              else
                echo "::error::couldn't read $MIRROR (exit $rc): does it exist, and is it public?"
                exit 1
              fi
              ;;
          esac
      - name: The SDK reports this version
        run: |
          set -euo pipefail
          sdk=$(sed -n 's/^let sdkVersion = "\(.*\)"$/\1/p' \
            packages/ios/Sources/GroundcoverRum/Core/Platform/DeviceAttributes.swift)
          echo "DeviceAttributes.swift=$sdk requested=$VERSION"
          if [ "$sdk" != "$VERSION" ]; then
            echo "::error::set sdkVersion in packages/ios/Sources/GroundcoverRum/Core/Platform/DeviceAttributes.swift to $VERSION first"
            exit 1
          fi
      # Dated, as RN's are: "Unreleased" would ship in the mirror and on the release.
      - name: The CHANGELOG has a dated entry for it
        run: |
          set -euo pipefail
          heading=$(grep -E "^## \[${VERSION//./\\.}\]" packages/ios/CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error::packages/ios/CHANGELOG.md has no '## [$VERSION]' entry"
            exit 1
          fi
          if ! [[ "$heading" =~ [0-9]{4}-[0-9]{2}-[0-9]{2} ]]; then
            echo "::error::date the CHANGELOG heading: '$heading'"
            exit 1
          fi
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      # build-mirror.sh writes the engine copy with Node's standard library, so no install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Write the mirror's tree
        run: packages/ios/scripts/build-mirror.sh "$RUNNER_TEMP/groundcover-rum-ios"
      - name: Build it on its own, and from an app's package by tag
        run: packages/ios/scripts/check-mirror.sh "$RUNNER_TEMP/groundcover-rum-ios" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-mirror
          path: ${{ runner.temp }}/groundcover-rum-ios
          if-no-files-found: error

  publish:
    name: Push to groundcover-rum-ios
    needs: validate
    # validate already fails anywhere else; this keeps the bot's key off any other ref even if
    # that step is ever lost.
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 10
    # Named so the repo can put a required reviewer on it, and give the bot's key to this job alone.
    environment: ios-mirror
    steps:
      # Here rather than in validate: an environment's variables reach only the jobs that name it.
      - name: groundcover-bot is connected
        env:
          APP_ID: ${{ vars.GROUNDCOVER_BOT_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::groundcover-bot isn't connected to the ios-mirror environment (see this workflow's header); run with dry_run and push the ios-mirror artifact by hand"
            exit 1
          fi
      # Exactly the tree validate checked.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-mirror
          path: ${{ runner.temp }}/tree
      # An hour-long token for groundcover-bot that can write the mirror's contents and nothing
      # else. Pinned by commit SHA.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: bot
        with:
          app-id: ${{ vars.GROUNDCOVER_BOT_APP_ID }}
          private-key: ${{ secrets.GROUNDCOVER_BOT_PRIVATE_KEY }}
          owner: groundcover-com
          repositories: groundcover-rum-ios
          permission-contents: write
      - name: Commit and tag the mirror
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The mirror is public, so the clone needs no credentials. The push sends the token as a
          # header, as actions/checkout does, so it is never written into .git/config.
          git clone -q "https://github.com/$MIRROR.git" "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          if git rev-parse -q --verify HEAD > /dev/null; then
            if [ "$(git symbolic-ref --short HEAD)" != main ]; then
              echo "::error::$MIRROR's default branch must be main"
              exit 1
            fi
          else
            # A new, empty mirror: its first release starts main.
            git symbolic-ref HEAD refs/heads/main
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/tree/." .
          git add -A
          git -c user.name='groundcover-bot[bot]' \
            -c user.email='groundcover-bot[bot]@users.noreply.github.com' \
            commit -q --allow-empty -m "GroundcoverRum $VERSION"
          git tag "$VERSION"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          # Both or neither. A tag that already exists is refused, never moved.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin main "refs/tags/$VERSION"
          echo "Pushed $MIRROR main and tag $VERSION ($(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Push the release tag
    needs: publish
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    # Through the API, at the commit validate checked, not wherever the branch is by now. No
    # workflow runs on ios-v* tags, so the job's own token is enough. A tag already at that commit
    # is a re-run finishing the job, and passes.
    steps:
      - name: Tag ios-v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-v${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/ref.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          case "$status" in
            404)
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
              echo "Pushed $TAG at $SHA." >> "$GITHUB_STEP_SUMMARY"
              ;;
            200)
              existing=$(jq -r .object.sha "$RUNNER_TEMP/ref.json")
              if [ "$existing" != "$SHA" ]; then
                echo "::error::$TAG already points at $existing, not $SHA"
                exit 1
              fi
              echo "$TAG was already at $SHA." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) echo "::error::couldn't check whether $TAG exists (HTTP $status)"; exit 1 ;;
          esac
