name: Native Android CI

# Lint, unit, build and device e2e checks for the native Android SDK (packages/android, the
# rum-android library and its integrations), the Kotlin engine it compiles from
# packages/core/kotlin, and its playground (apps/android-playground), which the shared Mobilewright
# suite drives with APP=native. Shaped like flutter.yml, for the same reasons:
#
# - `push` is scoped to main, and neither trigger is path-filtered. `Native Android CI` at the
#   bottom is the lane's check to require, and a workflow skipped by a trigger-level path filter
#   creates no check run at all, which would block every PR that doesn't touch Android. So the
#   workflow always starts, `changes` decides whether the work runs, and `gate` always reports.
# - `changes` filters on a positive list of paths, failing CLOSED, like the RN and Flutter
#   lanes'.
#
# iOS has a workflow of its own (native-ios.yml), so an Android-only change spends no macOS
# minutes and an iOS-only change never waits on emulators.
on:
  push:
    branches: [main]
  # No `paths:` on either trigger, on purpose — see the header.
  pull_request:
  workflow_dispatch:

# Least privilege; `pull-requests: read` goes to the `changes` job alone.
permissions:
  contents: read

# Only PR runs are cancelled: a main run is the post-merge signal and must always finish.
concurrency:
  group: native-android-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.x'
  # The emulator build react-native.yml pins and caches its AVD snapshot under. Keep the two
  # equal: this lane restores RN's snapshot and never saves its own.
  ANDROID_EMULATOR_BUILD: '16428233'

jobs:
  changes:
    name: Native Android changed paths
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      # 'true' when the filter didn't run: see its `if:`.
      android: ${{ steps.filter.outputs.android || 'true' }}
    steps:
      # How the files are listed, and when the filter is skipped: react-native.yml.
      - if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.changed_files < 3000) }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts when it matches a path below and none of the `!` ones.
          predicate-quantifier: some-with-excludes
          filters: |
            android:
              - 'packages/android/**'
              - 'apps/android-playground/**'
              # The Kotlin engine the library compiles, and its unit-test steps (shared with
              # react-native.yml and flutter.yml).
              - 'packages/core/kotlin/**'
              - '.github/actions/engine-tests-kotlin/**'
              # The wire contract and the shared e2e suite, which the native lanes run too, with
              # the suite's root config, the Mobilewright patch and the install it runs from.
              - 'packages/core/wire/**'
              - 'tests/e2e/mobile/**'
              - 'mobilewright.config.ts'
              - 'patches/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              # ktlint reads it.
              - '.editorconfig'
              - '.github/workflows/native-android.yml'

              # Markdown and the licences, which nothing this lane builds or runs reads.
              - '!**/*.md'
              - '!**/LICENSE'

  # ktlint, Android lint, the API files and the unit tests, then the release AARs, in one Gradle
  # run over every module (the SDK and its Compose, OkHttp and Timber integrations): they share
  # its configuration, and the AARs add little on top. The Ubuntu 22.04 image, as the
  # other lanes' Android builds, for its Android SDK.
  library:
    name: Lint, API surface, unit tests, AAR build (Kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # The core (config, session, events, transport) keeps Android APIs out, so it stays
      # platform-free. What needs one lives in core/platform. It
      # looks for any android. or androidx. reference, not only imports: a fully qualified call
      # (android.os.SystemClock.elapsedRealtime()) needs no import.
      - name: The core imports no Android API
        run: |
          if git grep -nE '(^|[^[:alnum:]_."])androidx?\.[a-z]' -- \
            'packages/android/rum-android/src/main/kotlin/com/groundcover/rum/core' \
            ':!packages/android/rum-android/src/main/kotlin/com/groundcover/rum/core/platform'; then
            echo "::error::Move Android-specific code into the core's platform package"
            exit 1
          fi
      # Read-only off main: GitHub scopes cache writes per branch, so a save from every PR would
      # duplicate the Gradle cache per branch. The wrapper pins Gradle itself.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # ktlintCheck covers everything the modules compile except the engine, and the build
      # scripts; apiCheck compares each module's public API with its api/<module>.api; the unit
      # tests include the public API as Kotlin and Java apps call it.
      - name: ktlint, Android lint, API surface, unit tests, release AARs
        working-directory: packages/android
        run: ./gradlew ktlintCheck lint apiCheck testDebugUnitTest assembleRelease --no-daemon

  # The engine's JVM suite, from the definition RN's and Flutter's lanes share.
  engine-unit:
    name: Engine unit tests (Kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/engine-tests-kotlin
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

  # The playground's locator contract test (Robolectric), then its debug APK, handed to the e2e
  # shards as an artifact. A debug APK of Kotlin alone runs on any emulator ABI.
  android-app:
    name: Playground + locator contract (Android)
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Locator contract + debug APK
        working-directory: apps/android-playground
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-playground-android
          path: apps/android-playground/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  # The shared Mobilewright suite against the playground with APP=native, on the emulator
  # configuration RN's and Flutter's lanes use, after the cheap checks so emulators never boot
  # against a library that already failed.
  e2e-android:
    name: E2E — Android Emulator (shard ${{ matrix.shard }}/3)
    needs: [library, engine-unit, android-app]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.0
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Restore-only: react-native.yml saves this store from main.
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-playground-android
          path: apps/android-playground/artifacts
      # RN's snapshot, saved from main by react-native.yml. Restore-only here: one lane owns the
      # entry, so two lanes never race to write it.
      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-emu${{ env.ANDROID_EMULATOR_BUILD }}
      - name: Create AVD (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: ${{ env.ANDROID_EMULATOR_BUILD }}
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: false
          script: echo "AVD created."
      - name: Free runner disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - name: Run e2e on an Android emulator
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "1"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-build: ${{ env.ANDROID_EMULATOR_BUILD }}
          force-avd-creation: false
          emulator-boot-timeout: 150
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          disable-animations: true
          script: MW_SHARD=${{ matrix.shard }}/3 bash tests/e2e/mobile/ci-native-android-e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-e2e-report-android-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  gate:
    name: Native Android CI
    needs: [changes, library, engine-unit, android-app, e2e-android]
    if: ${{ !cancelled() }}
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      # As in flutter.yml: `!cancelled()` so a failed dependency is judged here rather than
      # skipping the gate (a skipped job reports Success), and "success or skipped" because a
      # filtered-out job reports skipped while a broken one reports failure.
      - name: Check lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
