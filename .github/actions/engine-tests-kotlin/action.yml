name: Engine unit tests (Kotlin)
description: >-
  The native engine's JVM unit tests (packages/core/kotlin/jvm-test). One
  definition for every lane that ships the engine (react-native.yml,
  flutter.yml, native-android.yml), so each lane's gate holds the same check.
  The caller checks out the repo first.

inputs:
  cache-read-only:
    description: >-
      Passed to setup-gradle. Each caller states its own policy; see the call
      sites.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '17'
    # setup-gradle is kept for its dependency cache; the version actually used is
    # the one the wrapper pins, not whatever the action would install.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
    - name: Engine unit tests (Kotlin)
      shell: bash
      working-directory: packages/core/kotlin/jvm-test
      run: ./gradlew test --no-daemon
