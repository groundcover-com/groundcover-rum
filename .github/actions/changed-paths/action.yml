name: Changed paths
description: List the files a pull request changes, so jobs can filter on them.

# Why this exists at all, rather than a trigger-level `paths` / `paths-ignore`:
#
# A workflow skipped by a trigger-level path filter creates NO check run. GitHub
# documents the consequence — such checks "stay in a 'Pending' state and block
# merging" — so any lane whose checks are REQUIRED cannot use one.
#
# Filtering therefore has to happen at the job level, via `if:`. A job skipped by
# a conditional reports Success, which satisfies a required check. But GitHub
# exposes no changed-files context to an `if:` — the pull_request payload carries
# no file list — so the list has to be fetched, which needs a step, which needs a
# job. Hence one small `changes` job per lane, calling this.
#
# Shared as an action so the brittle half lives in exactly one place: pagination,
# the non-PR short-circuit, and the empty-list guard. Each caller applies its OWN
# pattern list rather than passing patterns in here, because the lanes have
# deliberately opposite semantics — the web lane fails OPEN (run unless the diff
# is provably irrelevant) and the mobile lane fails CLOSED (run only on a
# positive match). Parameterising that into one filter would hide the asymmetry,
# which is the single most important property of either list.
#
# Needs `pull-requests: read` in the calling workflow.

inputs:
  token:
    description: Token used to read the pull request's file list.
    required: false
    default: ${{ github.token }}

outputs:
  files-path:
    description: >
      Path to a newline-delimited list of the files this PR changes. Empty for
      non-pull_request events.
    value: ${{ steps.collect.outputs.files-path }}
  is-pull-request:
    description: >
      'true' when a real PR file list was collected, 'false' otherwise. On
      `push` and `workflow_dispatch` callers should assume everything changed:
      those events keep their trigger-level filters, so if the workflow ran at
      all then the paths already matched, and there is nothing left to decide.
    value: ${{ steps.collect.outputs.is-pull-request }}

runs:
  using: composite
  steps:
    - id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        if [ "${{ github.event_name }}" != 'pull_request' ]; then
          echo "event is ${{ github.event_name }}, not pull_request — callers assume everything changed"
          echo 'is-pull-request=false' >> "$GITHUB_OUTPUT"
          echo 'files-path=' >> "$GITHUB_OUTPUT"
          exit 0
        fi

        recs="$RUNNER_TEMP/changed-records.tsv"
        out="$RUNNER_TEMP/changed-paths.txt"

        # One record per changed file: the new path, plus the pre-rename path
        # when the record is a rename.
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
          -q '.[] | [.filename, (.previous_filename // "")] | @tsv' > "$recs"

        # A pull request always changes at least one file, so an empty list means
        # the fetch failed rather than that nothing changed. Failing here is the
        # only safe option: a fail-open caller would run everything (merely
        # wasteful), but a fail-closed caller would run NOTHING and report green,
        # which is a required check passing on an untested commit.
        if [ ! -s "$recs" ]; then
          echo "::error::no changed files returned for PR #${PR} — refusing to guess"
          exit 1
        fi

        # The /files endpoint is capped at 3000 files and `--paginate` stops there
        # without complaining, so a very large PR yields a silently truncated
        # list. Truncation breaks BOTH lanes in the quiet direction: the
        # fail-open filter can conclude "everything I can see is RN-only" and
        # skip the web suite, and the fail-closed filter can miss its match and
        # skip the mobile lane. Both then report green. Compare against the PR's
        # own count instead of trusting the page stream.
        expected=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" -q '.changed_files')
        got=$(wc -l < "$recs" | tr -d ' ')
        if [ "$got" -ne "$expected" ]; then
          echo "::error::changed-file list is incomplete — collected ${got} records but PR #${PR} reports ${expected} changed files (the /files endpoint caps at 3000)"
          exit 1
        fi

        # Emit BOTH sides of a rename. Keeping only `filename` loses the fact
        # that the old location changed: a file moved OUT of packages/browser
        # INTO packages/react-native looks like a pure RN diff, so the web lane
        # would skip even though the browser package just lost a source file.
        # The mobile lane has the mirror problem for files moved out of it.
        cut -f1 "$recs" >  "$out"
        cut -f2 "$recs" | grep -v '^$' >> "$out" || true
        sort -u -o "$out" "$out"

        echo "changed paths for #${PR} (${expected} files, ${got} records, both sides of any rename):"
        sed 's/^/  /' "$out"
        echo 'is-pull-request=true' >> "$GITHUB_OUTPUT"
        echo "files-path=$out" >> "$GITHUB_OUTPUT"
