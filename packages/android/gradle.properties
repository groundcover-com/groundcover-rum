# AGP 9 compiles Kotlin itself by default ("built-in Kotlin"), and neither the
# binary-compatibility validator nor the Kotlin plugin's own ABI validation sees
# that compilation: both find no classes and write an empty API file. So this
# build opts out and applies the Kotlin Android plugin as before AGP 9. The
# opt-out is deprecated and goes in AGP 10. Needed until an ABI checker supports
# built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false

# Gradle's defaults (512 MiB heap, 384 MiB metaspace) run out of metaspace once the four
# modules' lint, the Compose compiler and the Robolectric tests share one build, and the daemon
# fails with OutOfMemoryError: Metaspace. The playground's build runs at 4 GiB too.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# What Maven Central gets, for all four artifacts (com.vanniktech.maven.publish): the POM and the
# sources and Javadoc jars, which `publishToMavenLocal` builds. Gradle neither signs nor uploads:
# release-android.yml does both, outside any build, so the signing key and the portal token never
# reach a build script. Each module's build script names its own artifact; the artifact id is the
# module's name. The four release together, at one version: the integrations call the SDK's
# internal API, which a mixed set could break. release-android.yml checks this version against
# SDK_VERSION in rum-android's DeviceAttributes.kt.
GROUP=com.groundcover
VERSION_NAME=0.0.1-rc.2

# The POM. A published POM never changes, so its links must be permanent.
POM_URL=https://docs.groundcover.com/investigate/real-user-monitoring-rum
POM_INCEPTION_YEAR=2026
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/license/mit
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=groundcover
POM_DEVELOPER_NAME=groundcover
POM_DEVELOPER_URL=https://www.groundcover.com
POM_SCM_URL=https://github.com/groundcover-com/groundcover-rum
POM_SCM_CONNECTION=scm:git:https://github.com/groundcover-com/groundcover-rum.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/groundcover-com/groundcover-rum.git
POM_ISSUE_SYSTEM=GitHub
POM_ISSUE_URL=https://github.com/groundcover-com/groundcover-rum/issues
